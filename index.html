<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>群档案 · 记录、连接与被看见</title>
<meta name="description" content="群档案 —— 收录群内的每一次发声，让碎片重新被看见。">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="assets/site.css">
<script>/* 主题预设：在首次绘制前应用，避免闪烁 */try{var t=localStorage.getItem('gb-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>

<!-- 公共头部（公告条 + 导航），由 load-commons.js 注入 -->
<div id="header-placeholder"></div>

<main id="list">
  <!-- Hero：置顶 / 最新 -->
  <section class="hero wrap">
    <div class="hero-grid">
      <article class="hero-main reveal" id="heroMain"></article>
      <div class="hero-side" id="heroSide"></div>
    </div>
  </section>

  <!-- 主体：列表 + 侧栏 -->
  <div class="wrap layout">
    <section>
      <div class="section-head">
        <div>
          <h2 id="listTitle">最新发布</h2>
          <div class="toolbar-line">
            <input id="search" class="search-inp" type="search" placeholder="搜索标题或正文…" aria-label="搜索文章">
            <label class="sel">排序
              <select id="sort" aria-label="排序方式">
                <option value="Default" selected>默认</option>
                <option value="CREATE_AT">创建时间</option>
                <option value="UPDATED_AT">修改时间</option>
                <option value="UP_AT">点赞量</option>
              </select>
            </label>
            <label class="chk"><input type="checkbox" id="UP"> 升序</label>
            <span class="muted" id="countHint" style="font-size:13px"></span>
          </div>
        </div>
        <div class="tabs" id="tabs"></div>
      </div>

      <div class="pager" id="pagerTop"></div>
      <div class="cards" id="cards"></div>
      <div class="pager" id="pagerBottom"></div>
    </section>

    <aside class="sidebar" id="tags">
      <div class="panel reveal">
        <h3 class="panel-title">热门榜</h3>
        <ol class="rank" id="rank"></ol>
      </div>
      <div class="panel reveal">
        <h3 class="panel-title">分类</h3>
        <div class="tags" id="tagList"></div>
      </div>
      <div class="panel dark sub reveal">
        <h4>订阅更新</h4>
        <p>想在新文章发布时收到提醒？用 RSS 订阅即可 —— 不用留邮箱，也不用注册本站账号。</p>
        <form action="subscribe.html" method="get">
          <button type="submit" style="width:100%">查看订阅方式</button>
        </form>
        <div class="hint">RSS 地址：/feed.xml · 也支持关注 GitHub 讨论区</div>
      </div>
    </aside>
  </div>
</main>

<!-- 公共页脚 -->
<div id="footer-placeholder"></div>

<script src="config.js"></script>
<script src="assets/imgmap.js" defer></script>
<script src="assets/net.js" defer></script>
<script src="assets/site.js" defer></script>
<script src="assets/demo.js" defer></script>
<script src="load-commons.js" defer></script>
<script src="oauth.js" defer></script>
<script src="main.js" defer></script>
</body>
</html>
