<script type="text/javascript">// ============================================================
// 轻量 GitHub OAuth 登录控制（适配现有 HTML 按钮）
// 配置：oauth.blacknet.cc.cd 为 OAuth Worker 地址
// ============================================================

(function() {
  'use strict';

  // ---------- 配置 ----------
  const OAUTH_BASE = 'https://oauth.blacknet.cc.cd';   // OAuth Worker 地址

  // DOM 元素（直接获取按钮）
  const loginBtn = document.getElementById('login');
  const logoutBtn = document.getElementById('logout');

  // ---------- UI 切换（只控制按钮显示） ----------
  function showLoggedIn() {
    if (loginBtn) loginBtn.style.display = 'none';
    if (logoutBtn) logoutBtn.style.display = 'inline-block'; // 或根据原样式调整
  }

  function showLoggedOut() {
    if (loginBtn) loginBtn.style.display = 'inline-block';
    if (logoutBtn) logoutBtn.style.display = 'none';
  }

  // 初始状态：默认显示登录，隐藏登出（等检查后调整）
  showLoggedOut();

  // ---------- 登录操作 ----------
  function login() {
    // 没有"记住我"复选框，默认不记住（会话级），若要启用可传 ?remember=true
    window.location.href = `${OAUTH_BASE}/login`;
  }

  // ---------- 登出操作 ----------
  async function logout() {
    try {
      const res = await fetch(`${OAUTH_BASE}/logout`, {
        credentials: 'include'   // 携带 cookie
      });
      if (res.ok) {
        showLoggedOut();
        // 可选：刷新页面或重载内容
        // window.location.reload();
      } else {
        console.error('Logout failed:', res.status);
      }
    } catch (e) {
      console.error('Logout error:', e);
    }
  }

  // ---------- 检查登录状态（通过 /me） ----------
  async function checkLoginStatus() {
    try {
      const res = await fetch(`${OAUTH_BASE}/me`, {
        credentials: 'include'   // 携带 cookie
      });
      if (res.ok) {
        showLoggedIn();
        return true;
      } else {
        showLoggedOut();
        return false;
      }
    } catch (e) {
      console.error('Check login error:', e);
      showLoggedOut();
      return false;
    }
  }

  // ---------- 处理 OAuth 回调（URL hash） ----------
  function handleOAuthRedirect() {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#user=')) {
      // 登录成功，直接显示登录状态，无需额外验证
      showLoggedIn();
      // 清除 hash 避免刷新后重复
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
      return true;
    }
    return false;
  }

  // ---------- 绑定事件 ----------
  if (loginBtn) loginBtn.addEventListener('click', login);
  if (logoutBtn) logoutBtn.addEventListener('click', logout);

  // ---------- 初始化 ----------
  function init() {
    // 1. 优先处理回调 hash（登录成功时）
    const handled = handleOAuthRedirect();
    if (handled) {
      // 已通过 hash 登录，无需再调用 /me
      return;
    }

    // 2. 否则通过 /me 验证实际登录状态
    checkLoginStatus();
  }

  // 等待 DOM 就绪
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();</script><div id="container_7446523"><div class="textstyle2"><div id="userbox"><div class="textstyle2"><input name="Button2" type="button" value="&#30331;&#20986;" title=""  id="logout" >

<div id="main"><div class="textstyle1"><script type="text/javascript">(function() {
  'use strict';

  // ---------- 配置 ----------
  const API_URL = 'https://api.blacknet.cc.cd';  // 你的 API Worker 地址
  const CONTAINER = document.getElementById('main');

  // ---------- 辅助函数 ----------

  // 1. 从 Markdown 正文中提取第一张图片 URL
  function extractFirstImage(markdown) {
    const match = markdown.match(/!\[.*?\]\((.*?)\)/);
    return match ? match[1] : null;
  }

  // 2. 提取纯文本摘要（去除 Markdown 标记）
  function getPlainText(markdown, maxLen = 150) {
    let text = markdown
      .replace(/!\[.*?\]\(.*?\)/g, '')      // 去除图片
      .replace(/\[.*?\]\(.*?\)/g, '$1')     // 链接只保留文字
      .replace(/[#*`>_\-]/g, '')            // 去除常见标记
      .trim();
    if (text.length > maxLen) {
      text = text.slice(0, maxLen) + '...';
    }
    return text;
  }

  // 3. 格式化日期
  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  // 4. 获取点赞数（THUMBS_UP）
  function getThumbsUp(reactionGroups) {
    const group = reactionGroups.find(g => g.content === 'THUMBS_UP');
    return group ? group.users.totalCount : 0;
  }

  // ---------- 生成卡片 HTML ----------
  function createCard(post, index) {
    const id = post.id;
    const title = post.title || '无标题';
    const author = post.author.login;
    const avatar = post.author.avatarUrl;
    const createdAt = formatDate(post.createdAt);
    const commentsCount = post.comments.totalCount;
    const thumbsUp = getThumbsUp(post.reactionGroups);
    const imageUrl = extractFirstImage(post.body) || 'rc_images/pole.jpg'; // 默认占位
    const summary = getPlainText(post.body, 200);

    // 注意：id 属性使用 item-{index}，保证唯一性，但不影响样式
    return `
      <div style="box-sizing: border-box; vertical-align: top; border-radius: 15px; position:relative; display: inline-block; margin:10px; width:80%; min-height:320px; max-width:1000px; background-color:#FFFFFF; border: 1px solid #404040; " id="item-${index}">
        <div style="margin: 10px; display: block; " id="item_padding" >
          <div style="text-align:left;">
            <span style="font-size:12pt; font-family:Arial, Helvetica, sans-serif; color:#000000; "><br/></span>
            <span style="font-size:26pt; font-family:Arial, Helvetica, sans-serif; color:#444444; font-weight:bold; ">${title}<br/><br/></span>
            <div style="vertical-align: top; position:relative; display: inline-block; width:100%; min-height:150px; background:none; " id="item_infomation">
              <div style="margin: 10px; display: block; " id="item_infomation_padding" >
                <div style="text-align:left;">
                  <span style="font-size:12pt; font-family:Arial, Helvetica, sans-serif; color:#000000; line-height: 1.5; ">${summary}</span>
                </div>
                <div style="text-align:right;">
                  <img src="${imageUrl}" style="vertical-align: bottom; position:relative; display: inline-block; height:150px; background:none; " id="item_pic" alt="" title="" />
                </div>
                <div style="text-align:left;">
                  <span style="font-size:12pt; font-family:Arial, Helvetica, sans-serif; color:#000000; line-height: 1.5; "><br/><br/><br/></span>
                  <a href="/blog.html?id=${id}" style="text-decoration:none">
                    <div style="vertical-align: bottom; border-radius: 5px; position:relative; display: inline-block; width:150px; height:40px; background-color:#B1782E; box-shadow: 7px 7px 4px -5px rgba(0, 0, 0, 0.784314); " id="item_open">
                      <div style="display: table; width: 100%; height: 100%;">
                        <div style="display: table-cell; vertical-align: middle;">
                          <div style="text-align:center;">
                            <span style="font-size:12pt; font-family:Arial, Helvetica, sans-serif; color:#FFFFFF; ">立刻查看</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </a>
                  <span style="font-size:12pt; font-family:Arial, Helvetica, sans-serif; color:#000000; line-height: 1.5; "><br/></span>
                </div>
                <div style="clear:both"></div>
              </div>
            </div>
            <span style="font-size:12pt; font-family:Arial, Helvetica, sans-serif; color:#000000; "><br/></span>
            <div style="vertical-align: top; position:relative; display: inline-block; width:100%; min-height:50px; background:none; " id="item_author">
              <div style="margin: 10px; display: block; " id="item_author_padding" >
                <div style="display:flex; align-items:center; gap:8px;">
                  <img src="${avatar}" style="width:32px; height:32px; border-radius:50%;" alt="avatar" />
                  <span style="font-size:12pt; font-family:Arial, Helvetica, sans-serif; color:#000000;">${author}</span>
                  <span style="font-size:10pt; color:#888;">${createdAt}</span>
                  <span style="font-size:10pt; color:#888;">👍 ${thumbsUp}</span>
                  <span style="font-size:10pt; color:#888;">💬 ${commentsCount}</span>
                </div>
              </div>
            </div>
          </div>
          <div style="clear:both"></div>
        </div>
      </div>
    `;
  }

  // ---------- 加载数据并渲染 ----------
  async function loadPosts() {
    try {
      const res = await fetch(`${API_URL}/?first=10`);
      if (!res.ok) throw new Error('Network response was not ok');
      const data = await res.json();
      const posts = data.nodes || [];

      // 清空容器
      CONTAINER.innerHTML = '';

      // 生成卡片并追加
      posts.forEach((post, index) => {
        CONTAINER.innerHTML += createCard(post, index);
      });
    } catch (error) {
      console.error('加载文章失败:', error);
      CONTAINER.innerHTML = '<p style="text-align:center;padding:20px;">加载失败，请稍后重试。</p>';
    }
  }

  // ---------- 初始化 ----------
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadPosts);
  } else {
    loadPosts();
  }
})();</script></div>
