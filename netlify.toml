# ============================================================
# netlify.toml — 群档案（主站）+ 群书阁（book/）同域部署
# 部署：Netlify 连接 Chengxidaxia/GroupBlackNet，构建命令见下。
# 产物由 scripts/netlify-build.sh 组装到 dist/，源码与本地工具不发布。
# 书籍数据源：同源 docs/books → jsDelivr → raw.githubusercontent
#             （见 book/assets/js/config.js 的 CDN 段）
# ============================================================

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 本地预览：netlify dev 会先跑一遍构建再起静态服务
[dev]
  command = "bash scripts/netlify-build.sh && python -m http.server 8888 --directory dist"
  targetPort = 8888
  port = 8888
  framework = "#static"
  autoLaunch = false

# ------------------------------------------------------------
# 重定向（顺序即优先级：先具体，后通配）
# ------------------------------------------------------------

# ---- 前端同源反代（后端零改动）----
# 前端在「跨域被拦」时会把请求改写成同源路径：/proxy/<host>/<原路径>
# 同源请求浏览器不做 CORS 校验、不发预检，所以后端 CORS 白名单保持原样即可。
# 对应前端配置：config.js → PROXY（mode: 'auto'，站点没这条转发会自动改直连）。
#
# ⚠️ 只反代只读接口。oauth / upload 依赖 Cookie，经反代后 Cookie 的
#    Domain 对不上会直接掉登录态，所以故意不配它们。
[[redirects]]
  from = "/proxy/api.blacknet.cc.cd/*"
  to = "https://api.blacknet.cc.cd/:splat"
  status = 200
  force = true

# 群书阁挂在 /book/ 下时，它的 base 同样是站点根 /proxy。
# 令牌接口（读写书籍）与 raw 兜底都从这里出去。
[[redirects]]
  from = "/proxy/api.github.com/*"
  to = "https://api.github.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/raw.githubusercontent.com/*"
  to = "https://raw.githubusercontent.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/book"
  to = "/book/"
  status = 301

# 无扩展名直达（关掉 Pretty URLs 也能用）
[[redirects]]
  from = "/book/read"
  to = "/book/read.html"
  status = 200

[[redirects]]
  from = "/book/write"
  to = "/book/write.html"
  status = 200

# 子站自己的 404（Netlify 只认产物根目录的 404.html，子目录需显式指定）
[[redirects]]
  from = "/book/*"
  to = "/book/404.html"
  status = 404

# 主站兜底 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ------------------------------------------------------------
# 响应头
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 站点自身脚本/样式：改版后要立刻生效
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vditor 带版本号目录，可长缓存
[[headers]]
  for = "/vditor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 群书阁：页面与脚本不缓存（发布后立刻可见）
[[headers]]
  for = "/book/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 书籍密文：短缓存 + 强制二进制，避免被当 HTML 解析
# 注意：Netlify 同名头「后匹配者覆盖」，所以更具体的规则要放在后面
[[headers]]
  for = "/book/docs/books/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
    Content-Type = "application/octet-stream"
    Content-Disposition = "inline"
