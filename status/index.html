<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务状态 · 群档案</title>
<meta name="description" content="群档案主站、接口、RSS 与群书阁的可用性，每 2 分钟探测一次。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<!-- 基础排版与配色变量来自 Upptime status-page（MIT）的 global.css + themes，未改结构 -->
<link rel="stylesheet" href="/themes/light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/themes/dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/global.css">
<style>
/* 本页只做三件事：去掉模板的导航栏、把总状态做成一块横幅、把每项压成一行 + 一条 24 小时细条。
   间距/圆角/配色取值参考 status.deepseek.com，不引入任何外部资源。 */
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:760px;padding:0 1.25rem}

/* 顶部：只有标题与更新时间，没有导航栏 */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:2.75rem 0 1.25rem}
.top h1{font-size:1.125rem;font-weight:600;letter-spacing:.01em;margin:0}
.top .meta{font-size:.8125rem;color:var(--muted-text-color)}

/* 总状态横幅 */
.banner{display:flex;align-items:flex-start;gap:.7rem;padding:1rem 1.15rem;border:1px solid transparent;border-radius:.625rem;margin-bottom:1.5rem}
.banner svg{flex:none;width:1.125rem;height:1.125rem;margin-top:.15rem}
.banner strong{display:block;font-size:1rem;font-weight:600;line-height:1.35}
.banner p{margin:.15rem 0 0;font-size:.875rem;opacity:.8;line-height:1.5}
.banner.up{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.banner.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.banner.down{background:#fef2f2;border-color:#fecaca;color:#b91c1c}

/* 深色下横幅改为同色系低透明度底，避免整块亮白 */
@media (prefers-color-scheme: dark){
  .banner.up{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#86efac}
  .banner.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:#fcd34d}
  .banner.down{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.32);color:#fca5a5}
}

/* 服务列表 */
.card{border:1px solid var(--card-border-color);border-radius:.625rem;background:var(--card-background-color);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.15rem;background:var(--muted-surface-color);border-bottom:1px solid var(--line-color)}
.card-head h2{font-size:.9375rem;font-weight:600;margin:0}
.card-head span{font-size:.8125rem;color:var(--muted-text-color)}

/* 覆盖模板的卡片样式：从「带左色边的卡片」改为「表格行」 */
article,
article.up,
article.down,
article.degraded{
  border:0;border-left:0!important;border-radius:0;
  padding:.85rem 1.15rem .95rem;
  background:transparent;
  border-top:1px solid var(--line-color);
}
article:first-child{border-top:0}
article+article{margin-top:0}
article+article+article{margin-top:0}

.row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.svc{display:flex;align-items:center;gap:.5rem;min-width:0;font-size:.9375rem;line-height:1.4}
.svc svg{flex:none;width:1rem;height:1rem}
.svc b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc em{font-style:normal;font-size:.8125rem;color:var(--muted-text-color);white-space:nowrap}
.pct{font-size:.875rem;color:var(--muted-text-color);white-space:nowrap}
.pct b{font-weight:600;color:var(--body-text-color)}

/* 24 小时条：每格 30 分钟 */
.bars{display:flex;gap:2px;height:9px;margin-top:.65rem}
.bars i{flex:1 1 0;min-width:0;border-radius:2px;background:var(--bar-empty-color)}
.bars i.up{background:#22c55e}
.bars i.down{background:#ef4444}
.bars i.warn{background:#f59e0b}

/* 底部：一行小字 */
.site-foot{margin:2rem 0 3rem;text-align:center;font-size:.8125rem;color:var(--muted-text-color);line-height:1.9}
.site-foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.site-foot a:hover{border-bottom-color:currentColor}
.site-foot .sep{opacity:.45;margin:0 .4rem}

@media (max-width:560px){
  .top{margin:1.75rem 0 1rem}
  .top h1{font-size:1rem}
  .top .meta{flex:1 0 100%;margin-top:.25rem}   /* 窄屏让更新时间自己占一行 */
  .banner{padding:.875rem 1rem}
  .card-head{padding:.6rem 1rem}
  article,article.up,article.down,article.degraded{padding:.75rem 1rem .85rem}
  .svc{font-size:.875rem}
  .svc em{display:none}     /* 窄屏先舍弃毫秒，保留名称与可用率 */
  .bars{height:8px;gap:1.5px;margin-top:.55rem}
  .site-foot{margin:1.5rem 0 2.25rem}
  .site-foot #footNote,
  .site-foot #footNote + .sep{display:none}
}
</style>
</head>
<body>

<main class="container">
  <div class="top">
    <h1>群档案 服务状态</h1>
    <div class="meta" id="updated">正在读取…</div>
  </div>

  <div class="banner up" id="banner">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#22c55e"/><path d="M5.9 10.4l2.6 2.6 5.6-5.7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <strong id="bannerTitle">正在读取…</strong>
      <p id="bannerSub">稍等一下</p>
    </div>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>服务状态</h2>
      <span>最近 24 小时</span>
    </div>
    <div id="list"></div>
  </section>

  <div class="site-foot">
    <span id="footNote">每 2 分钟由 Cloudflare 边缘探测一次</span>
    <span class="sep">·</span>
    <a href="https://grp.blacknet.cc.cd/">主站</a>
    <span class="sep">·</span>
    <a href="https://book.blacknet.cc.cd/">书阁</a>
    <span class="sep">·</span>
    <a href="/api/status" target="_blank" rel="noopener">API</a>
  </div>
</main>

<script src="/app.js" defer></script>
</body>
</html>
