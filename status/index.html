<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运行状态 · 群档案</title>
<meta name="description" content="群档案主站、接口、RSS 与群书阁的可用性，每 2 分钟探测一次。">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<!-- 样式全部来自 Upptime status-page（MIT），原样未改；深浅色跟随系统 -->
<link rel="stylesheet" href="/themes/light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/themes/dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/global.css">
<style>
/* 以下四条为本地补充：24 小时条、标题外链，颜色全部复用主题变量 */
.bars{display:flex;gap:2px;height:6px;margin-top:.6rem}
.bars i{flex:1;border-radius:1px;background:var(--card-border-color)}
.bars i.up{background:var(--up-border-left-color)}
.bars i.down{background:var(--down-border-left-color)}
.bars i.none{opacity:.4}
article h4 a{text-decoration:none}
article h4 a:hover{text-decoration:underline}

/* 以下原样搬自模板组件内的 scoped 样式：
   Nav.svelte / index.svelte / _layout.svelte，未作改动（模板把它们写在组件里，
   单独引 global.css 拿不到，所以照抄到页面） */
nav{font-weight:300;padding:0 1em;margin-bottom:2rem;white-space:nowrap;overflow-x:auto}
nav ul{margin:0;padding:0;display:flex;list-style:none;align-items:center;justify-content:center}
nav a{text-decoration:none;padding:1.5rem 2rem;display:block}
nav .logo{float:left;display:flex;align-items:center;padding:.5rem 0;font-weight:bold;margin-right:2rem}
nav .container{display:flex;justify-content:space-between;align-items:center}
header{margin-bottom:2rem}
p.lead{font-size:110%}
footer{text-align:center;opacity:.75;margin-top:3rem}

/* 一条窄屏适配：模板的 nav 链接在 390px 下会横向溢出，收一下内边距 */
@media (max-width:560px){
  nav a{padding:1rem .7rem}
  nav .logo{margin-right:.4rem}
  nav{padding:0 .5em}
}
</style>
</head>
<body>

<nav>
  <div class="container">
    <div><a class="logo" href="https://grp.blacknet.cc.cd/" title="返回群档案主站">群档案 Status</a></div>
    <ul>
      <li><a href="https://grp.blacknet.cc.cd/">主站</a></li>
      <li><a href="https://book.blacknet.cc.cd/">书阁</a></li>
      <li><a href="/api/status" target="_blank" rel="noopener">API</a></li>
    </ul>
  </div>
</nav>

<main class="container">
  <header>
    <h1>运行状态</h1>
    <p class="lead">主站、接口、RSS 与书阁的可用性。探测由 Cloudflare 边缘每 2 分钟发起一次。</p>
  </header>

  <section>
    <h2>当前状态</h2>
    <p id="summary">正在读取…</p>
  </section>

  <section class="live-status" id="list"></section>

  <p><small id="updated" style="opacity:.75"></small></p>
</main>

<footer>
  <p>页面样式取自 <a href="https://upptime.js.org/" target="_blank" rel="noopener">Upptime</a>（MIT）· 数据显示为最近一次探测结果，每 30 秒自动刷新</p>
</footer>

<script src="/app.js" defer></script>
</body>
</html>
