<!-- ============================================================
     head.html — 公共头部（公告条 + 吸顶导航）
     由 load-commons.js 注入到 #header-placeholder
     ⚠️ 不要在此写 <script>：innerHTML 注入不会执行脚本
     ============================================================ -->

<!-- 公告条：内容来自 CF 存储（config.js → ANNOUNCEMENTS_URL），无数据时自动隐藏 -->
<div class="ticker" id="ticker" hidden>
  <div class="label"><span class="pulse"></span>公告</div>
  <div class="viewport"><div class="track" id="tickerTrack"></div></div>
</div>

<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a class="brand" href="/" data-brand-link title="返回主站">群档案<span class="dot">.</span><small>Archive</small></a>

    <nav class="nav" id="siteNav">
      <a href="/" data-nav="home">首页</a>
      <a href="/index.html#list" data-nav="list">归档</a>
      <a href="/index.html#tags" data-nav="tags">标签</a>
      <a href="about.html" data-nav="about">关于</a>
      <a href="contact.html" data-nav="contact">联系</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" type="button" title="切换亮/暗主题" aria-label="切换亮/暗主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      </button>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" title="菜单" aria-label="菜单">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
      </button>

      <!-- 未登录 -->
      <div id="login-area">
        <label class="remember"><input type="checkbox" id="remember"> 记住我</label>
        <button class="btn btn-ghost" id="login" type="button">登录</button>
      </div>

      <!-- 已登录 -->
      <div id="user-area">
        <a id="user-link" href="#" target="_blank" rel="noopener" title="我的 GitHub">
          <img id="user-avatar" src="" alt="">
          <span id="username"></span>
        </a>
        <a class="btn btn-primary" href="/edit.html">✏️ <span>写稿</span></a>
        <button class="btn btn-ghost" id="logout" type="button">登出</button>
      </div>
    </div>
  </div>
</header>
