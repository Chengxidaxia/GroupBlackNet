<meta property="og:title" content="写作台 · BookBlackNet">
<meta property="og:url" content="https://book.blacknet.cc.cd/write.html">
<meta name="description" content="BookBlackNet 写作台：书架管理、云端草稿、一键发布。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239c3a2c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E书%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/write.css">
</head>
<body>

<!-- ================= 顶栏 ================= -->
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html">
      <span class="brand-mark">书</span>
      <span class="brand-txt">
        <span class="brand-name">群书阁</span>
        <span class="brand-sub">BookBlackNet</span>
      </span>
    </a>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">书库</a>
      <a class="nav-link on" href="write.html">写作台</a>
      <a class="nav-link" href="https://grp.blacknet.cc.cd/" title="群档案 · 主站">群档案</a>
    </nav>
    <div class="nav-actions">
      <button id="btn-settings" class="btn btn-ghost btn-sm" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        设置
      </button>
    </div>
  </div>
</header>

<main class="page">

  <!-- ================= 书架 ================= -->
  <section id="shelf-view" class="wrap desk">
    <div class="desk-head">
      <div>
        <h1 class="desk-title">我的书稿</h1>
        <p class="muted small desk-sub">草稿保存在本机浏览器，随时接着写；发布后才会进入书库。</p>
      </div>
      <div class="row gap-8 desk-acts">
        <button id="btn-import" class="btn btn-sm">导入 .book</button>
        <button id="btn-backup" class="btn btn-sm">备份</button>
        <button id="btn-sync" class="btn btn-sm" title="与云端 Gist 同步草稿">立即同步</button>
        <button id="btn-new" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          新建作品
        </button>
      </div>
    </div>

    <!-- 筛选工具条 -->
    <div class="shelf-bar" id="shelf-bar">
      <div class="shelf-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="shelf-q" type="search" placeholder="搜书名 / 笔名 / 简介 / 标签…" autocomplete="off">
      </div>
      <div id="shelf-cats" class="shelf-chips"></div>
      <select id="shelf-status" class="select sm">
        <option value="">全部状态</option>
        <option value="draft">草稿</option>
        <option value="published">已发布</option>
        <option value="private">私密</option>
      </select>
      <select id="shelf-sort" class="select sm">
        <option value="updated">最近更新</option>
        <option value="created">创建时间</option>
        <option value="title">书名</option>
        <option value="words">字数</option>
      </select>
    </div>

    <div id="desk-list" class="desk-grid"></div>
  </section>
</main>

<input type="file" id="file-hidden" accept=".book,.json,.md,.txt" class="hidden">

<script src="assets/js/config.js"></script>
<script src="assets/js/core/util.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/core/crypto.js"></script>
<script src="assets/js/core/markdown.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/shelf.js"></script>
<script src="assets/js/core/prefs.js"></script>
<script src="assets/js/core/net.js"></script>
<script src="assets/js/core/api.js"></script>
<script src="assets/js/core/gist.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/write.js"></script>
</body>
</html>
