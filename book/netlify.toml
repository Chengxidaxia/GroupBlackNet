# ============================================================
# netlify.toml — BookBlackNet（群书阁）
# 正式域名：book.blacknet.cc.cd
#
# 部署方式（二选一）：
#   A. Netlify 独立站：新建站点 → 仓库选 GroupBlackNet →
#      Base directory 填 book → 读取本文件 → publish = "."（无构建）
#   B. GitHub Pages：仓库 Chengxidaxia/BookBlackNet（根即站点），
#      Settings → Pages → Custom domain 填 book.blacknet.cc.cd，
#      根目录 CNAME 由 scripts/sync-book-repo.sh 自动写入。
#
# 后端不在此仓库：发布走 GitHub Contents API，或你自己的 CF Worker。
# ============================================================

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "python -m http.server 8888 --directory ."
  targetPort = 8888
  port = 8888
  framework = "#static"
  autoLaunch = false

# ------------------------------------------------------------
# 重定向
# ------------------------------------------------------------

# 同源反代（前端使用，GitHub 侧零配置）
# 浏览器直连 api.github.com / raw 不通时，前端把请求改写成 /proxy/<host>/<path>，
# 由这里转发。同源请求不做 CORS 校验、不发预检。
# 对应配置：assets/js/config.js → PROXY（auto 模式下没配这条会自动改直连）。
[[redirects]]
  from = "/proxy/api.github.com/*"
  to = "https://api.github.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/raw.githubusercontent.com/*"
  to = "https://raw.githubusercontent.com/:splat"
  status = 200
  force = true

# 主站后端复用：登录态（Cookie Domain=.blacknet.cc.cd 会随同源请求自动携带）、
# 图床上传（PAT 或 Cookie 鉴权）、图床读取（CDN 缓存在 CF 边缘）
[[redirects]]
  from = "/proxy/oauth.blacknet.cc.cd/*"
  to = "https://oauth.blacknet.cc.cd/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/upload.blacknet.cc.cd/*"
  to = "https://upload.blacknet.cc.cd/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/img.blacknet.cc.cd/*"
  to = "https://img.blacknet.cc.cd/:splat"
  status = 200
  force = true

# 邮箱账号服务：Netlify Function（同源调用，无 CORS、无 CF 质询）
# 存储用 Netlify Blobs（bbn-users）；本地开发用 netlify dev。
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

# GitHub 登录态（同源 Function）：替代直连 oauth.blacknet.cc.cd/me。
# Cookie github_token（Domain=.blacknet.cc.cd）同域自动携带；服务端拿它问
# GitHub /user。同源零 CORS（线上 oauth Worker 白名单未含 book，直连被拦）。
[[redirects]]
  from = "/api/gh/*"
  to = "/.netlify/functions/gh-auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/gh"
  to = "/.netlify/functions/gh-auth"
  status = 200
  force = true

# 图片上传（同源 Function → pixhost.to）：编辑器插图/封面用。
# 无密钥；请求体上限 ~6MB（Netlify），前端限 5MB。
[[redirects]]
  from = "/api/imgup"
  to = "/.netlify/functions/imgup"
  status = 200
  force = true

# publish = "." 意味着站点根就是本目录，构建配置与说明文档会一起被发布出去。
# 这些不该对外可见，直接 404 掉（不影响任何页面）。
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/read"
  to = "/read.html"
  status = 200
[[redirects]]
  from = "/write"
  to = "/write.html"
  status = 200
[[redirects]]
  from = "/editor"
  to = "/editor.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ------------------------------------------------------------
# 响应头
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 静态图片：Netlify CDN + 浏览器各缓存 30 天
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 书籍密文：短缓存 + 强制二进制
[[headers]]
  for = "/docs/books/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
    Content-Type = "application/octet-stream"
    Content-Disposition = "inline"

# 书目索引更靠后 ⇒ 覆盖上一条的 60 秒缓存
[[headers]]
  for = "/docs/books/index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"
