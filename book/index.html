<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>群书阁 · BookBlackNet</title>
<meta name="description" content="BookBlackNet 群书阁：长篇小说的写作与阅读空间。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239c3a2c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E书%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/home.css">
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html">
      <span class="brand-mark">书</span>
      <span class="brand-txt">
        <span class="brand-name">群书阁</span>
        <span class="brand-sub">BookBlackNet</span>
      </span>
    </a>
    <nav class="nav-links">
      <a class="nav-link on" href="index.html">书库</a>
      <a class="nav-link" href="write.html">写作台</a>
      <a class="nav-link" href="#shelf">我的书架</a>
    </nav>
    <div class="nav-actions">
      <a class="btn btn-primary btn-sm" href="write.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        开始写作
      </a>
    </div>
  </div>
</header>

<main class="page">

  <!-- ============ Hero ============ -->
  <section class="hero">
    <div class="wrap hero-in">
      <div class="hero-txt">
        <p class="eyebrow"><span class="dot"></span>长篇 · 连载 · 私密书稿</p>
        <h1 class="hero-title">把故事<br><em>写成一本书</em></h1>
        <p class="hero-sub">章节化管理、专注写作、浏览器本地存稿。<br>写完再发布，正文以密文存进书籍仓库。</p>

        <form class="hero-search" id="search-form" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search-input" type="search" placeholder="搜书名、作者或标签…" aria-label="搜索书籍">
          <button type="submit" class="btn btn-primary btn-sm">搜索</button>
        </form>

        <div class="hero-stats" id="hero-stats">
          <div class="hs"><b id="stat-books">—</b><span>作品</span></div>
          <div class="hs"><b id="stat-words">—</b><span>总字数</span></div>
          <div class="hs"><b id="stat-chaps">—</b><span>章节</span></div>
        </div>
      </div>

      <div class="hero-art" aria-hidden="true">
        <div class="book-stack" id="book-stack">
          <div class="bk bk-3"><i>未</i></div>
          <div class="bk bk-2"><i>完</i></div>
          <div class="bk bk-1"><i>待</i></div>
        </div>
        <div class="hero-art-cap">每一本都从第一章开始</div>
      </div>
    </div>
    <div class="hero-rule"></div>
  </section>

  <!-- ============ 继续阅读 ============ -->
  <section class="wrap sec hidden" id="continue-sec">
    <div class="sec-head">
      <h2 class="sec-title">继续阅读</h2>
      <p class="sec-desc">上次停下的地方</p>
    </div>
    <div class="continue-row" id="continue-row"></div>
  </section>

  <!-- ============ 书架 ============ -->
  <section class="wrap sec" id="shelf">
    <div class="sec-head shelf-head">
      <div>
        <h2 class="sec-title">书架</h2>
        <p class="sec-desc" id="shelf-desc">全部作品</p>
      </div>
      <div class="shelf-tools">
        <div class="chips" id="cat-chips"></div>
        <select class="select select-sm" id="sort-sel">
          <option value="updated">最近更新</option>
          <option value="words">字数最多</option>
          <option value="title">书名</option>
        </select>
      </div>
    </div>

    <div class="book-grid" id="book-grid">
      <!-- 骨架 -->
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
    </div>

    <div class="empty hidden" id="shelf-empty">
      <div class="empty-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"/><path d="M8 7h7M8 11h5"/></svg>
      </div>
      <div class="empty-title" id="empty-title">书库还空着</div>
      <div class="empty-desc" id="empty-desc">发布第一本书之后，它就会出现在这里。</div>
      <a class="btn btn-primary" href="write.html">去写第一本</a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span class="brand-mark" style="width:22px;height:22px;border-radius:6px;font-size:12px">书</span>
    <span>群书阁 · BookBlackNet</span>
    <span class="muted">正文以 AES-GCM 密文存储</span>
    <div class="spacer"></div>
    <a href="write.html">写作台</a>
  </div>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/core/util.js"></script>
<script src="assets/js/core/crypto.js"></script>
<script src="assets/js/core/markdown.js"></script>
<script src="assets/js/core/api.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
