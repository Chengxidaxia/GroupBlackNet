<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑器 · BookBlackNet</title>
<link rel="canonical" href="https://book.blacknet.cc.cd/editor.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="群书阁">
<meta property="og:title" content="编辑器 · BookBlackNet">
<meta property="og:url" content="https://book.blacknet.cc.cd/editor.html">
<meta name="description" content="BookBlackNet 编辑器：章节写作、Markdown、专注模式。">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239c3a2c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E书%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/write.css">
</head>
<body class="editing">

<!-- ================= 顶栏 ================= -->
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html">
      <span class="brand-mark">书</span>
      <span class="brand-txt">
        <span class="brand-name">群书阁</span>
        <span class="brand-sub">BookBlackNet</span>
      </span>
    </a>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">书库</a>
      <a class="nav-link" href="write.html">写作台</a>
      <a class="nav-link" href="https://grp.blacknet.cc.cd/" title="群档案 · 主站">群档案</a>
    </nav>
    <div class="nav-actions">
      <span id="save-hint" class="small muted nowrap"></span>
      <button id="btn-settings" class="btn btn-ghost btn-sm" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        设置
      </button>
    </div>
  </div>
</header>

<main class="editor" id="editor-view">
  <div class="ed-head">
    <button id="btn-back" class="icon-btn" title="返回书稿列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <input id="book-title" class="book-title-input" maxlength="60" spellcheck="false" placeholder="作品名">
    <span id="pub-badge" class="badge badge-draft">草稿</span>
    <div class="spacer"></div>
    <span id="ed-stats" class="small muted nowrap"></span>
    <button id="btn-meta" class="btn btn-sm btn-ghost">作品信息</button>
    <button id="btn-preview" class="btn btn-sm" aria-pressed="false">预览</button>
    <button id="btn-publish" class="btn btn-primary btn-sm">发布</button>
  </div>

  <div class="ed-body">
    <!-- 章节栏 -->
    <aside class="ed-chapters" id="ed-chapters">
      <div class="chap-head">
        <button id="btn-toc-ch" class="icon-btn sm" title="章节目录" aria-label="章节目录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="chap-label">目录</span>
        <span id="chap-count" class="chap-count">1 章</span>
        <button id="btn-add-chap" class="icon-btn sm" title="新建章节">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <ol id="chap-list" class="chap-list"></ol>
      <div class="chap-foot">
        <button id="btn-import-md" class="link-btn">导入 Markdown 拆分章节</button>
        <button id="btn-del-chap" class="link-btn danger">删除本章</button>
      </div>
    </aside>
    <div id="chap-mask" class="chap-mask hidden"></div>

    <!-- 写作区 -->
    <div class="ed-main">
      <div class="ed-tools" id="ed-tools">
        <button class="tb" data-cmd="undo" title="撤销 (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg>
        </button>
        <button class="tb" data-cmd="redo" title="重做 (Ctrl+Y)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></svg>
        </button>
        <span class="tb-sep"></span>
        <button class="tb" data-cmd="h2" title="小标题">H</button>
        <button class="tb tb-b" data-cmd="bold" title="加粗 (Ctrl+B)">B</button>
        <button class="tb tb-i" data-cmd="italic" title="斜体 (Ctrl+I)">I</button>
        <button class="tb tb-s" data-cmd="strike" title="删除线">S</button>
        <button class="tb" data-cmd="quote" title="引用">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h4v4c0 2.5-1.4 4.3-4 5v-2c1.3-.5 2-1.4 2-2H7V7zm7 0h4v4c0 2.5-1.4 4.3-4 5v-2c1.3-.5 2-1.4 2-2h-2V7z"/></svg>
        </button>
        <button class="tb" data-cmd="ul" title="无序列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="tb" data-cmd="ol" title="有序列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><text x="2" y="8" font-size="6" fill="currentColor" stroke="none">1</text><text x="2" y="14" font-size="6" fill="currentColor" stroke="none">2</text><text x="2" y="20" font-size="6" fill="currentColor" stroke="none">3</text></svg>
        </button>
        <button class="tb" data-cmd="divider" title="分隔线">—</button>
        <button class="tb" data-cmd="link" title="链接">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </button>
        <span class="tb-sep"></span>
        <button class="tb" data-cmd="image" title="插入图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg>
        </button>
        <div class="spacer"></div>
        <button class="tb tb-focus" id="btn-focus" title="专注模式 (Esc 退出)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <span>专注</span>
        </button>
      </div>

      <input id="ch-title" class="ch-title" maxlength="80" spellcheck="false" placeholder="章节标题">
      <textarea id="ed-text" class="ed-text" spellcheck="false"
                placeholder="从这里开始写。&#10;&#10;支持 Markdown：# 小标题、**加粗**、> 引用、- 列表。&#10;正文里的单个换行会保留，适合小说的短句节奏。"></textarea>
    </div>

    <!-- 实时预览 -->
    <aside class="ed-preview" id="ed-preview">
      <div class="preview-head">
        <span class="chap-label">预览</span>
        <div class="spacer"></div>
        <span id="preview-count" class="small muted"></span>
      </div>
      <div class="preview-body md-body" id="preview-body"></div>
    </aside>
  </div>

  <div class="ed-foot">
    <span id="foot-state" class="small muted">就绪</span>
    <button id="gist-state" class="link-btn" title="点击立即同步到云端（Gist）">云：未同步</button>
    <div class="spacer"></div>
    <span id="foot-count" class="small muted"></span>
  </div>
</main>

<input type="file" id="file-md-hidden" accept=".md,.txt" class="hidden">

<script src="assets/js/config.js"></script>
<script src="assets/js/core/util.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/core/undo.js"></script>
<script src="assets/js/core/crypto.js"></script>
<script src="assets/js/core/markdown.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/prefs.js"></script>
<script src="assets/js/core/stats.js"></script>
<script src="assets/js/core/net.js"></script>
<script src="assets/js/core/api.js"></script>
<script src="assets/js/core/auth.js"></script>
<script src="assets/js/core/upload.js"></script>
<script src="assets/js/core/gist.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/editor.js"></script>
</body>
</html>
