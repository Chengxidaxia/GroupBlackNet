<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读 · BookBlackNet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239c3a2c'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E书%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/write.css">
<link rel="stylesheet" href="assets/css/read.css">
</head>
<body class="reading">

<!-- 阅读工具条 -->
<header class="reader-bar" id="reader-bar">
  <a class="icon-btn" href="index.html" title="返回书库">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="rb-title" id="rb-title">阅读</div>
  <div class="rb-progress"><i id="rb-progress"></i></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-toc" title="目录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="icon-btn" id="btn-font" title="排版">
    <span style="font-family:var(--serif);font-size:15px;font-weight:600">A</span><span style="font-size:10px">a</span>
  </button>
  <button class="icon-btn" id="btn-theme" title="主题">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
  </button>
</header>

<!-- 目录抽屉 -->
<aside class="toc" id="toc">
  <div class="toc-head">
    <span class="chap-label">目录</span>
    <span class="chap-count" id="toc-count"></span>
    <button class="icon-btn sm" id="btn-toc-close" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="toc-book">
    <div class="toc-cover" id="toc-cover">书</div>
    <div class="stack" style="min-width:0">
      <div class="toc-name" id="toc-name">—</div>
      <div class="small muted" id="toc-author">—</div>
    </div>
  </div>
  <ol class="toc-list" id="toc-list"></ol>
</aside>
<div class="toc-mask" id="toc-mask"></div>

<!-- 排版设置 -->
<div class="rd-panel" id="rd-panel">
  <div class="rdp-row">
    <span class="rdp-label">字号</span>
    <div class="rdp-seg" id="seg-size">
      <button data-v="-1">A−</button><span id="val-size">19</span><button data-v="1">A+</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">行距</span>
    <div class="rdp-seg" id="seg-lh">
      <button data-v="1.7">紧</button><button data-v="1.95">适中</button><button data-v="2.2">松</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">版心</span>
    <div class="rdp-seg" id="seg-width">
      <button data-v="620">窄</button><button data-v="720">中</button><button data-v="840">宽</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">字体</span>
    <div class="rdp-seg" id="seg-font">
      <button data-v="serif">宋</button><button data-v="sans">黑</button>
    </div>
  </div>
  <div class="rdp-row">
    <span class="rdp-label">主题</span>
    <div class="rdp-seg" id="seg-theme">
      <button data-v="paper">纸白</button><button data-v="sepia">米黄</button><button data-v="night">夜</button>
    </div>
  </div>
</div>

<!-- 正文 -->
<main class="reader-main" id="reader-main">
  <div id="reader-state" class="reader-state">
    <div class="spinner ink"></div>
    <p class="small muted">正在打开…</p>
  </div>

  <article id="reader-art" class="reader-art md-body hidden">
    <header class="book-head" id="book-head">
      <div class="bh-cover" id="bh-cover">书</div>
      <h1 class="bh-title" id="bh-title">—</h1>
      <div class="bh-meta" id="bh-meta"></div>
      <p class="bh-intro" id="bh-intro"></p>
      <div class="bh-tags" id="bh-tags"></div>
      <div class="bh-line"></div>
    </header>

    <section id="chapter-wrap">
      <h2 class="chap-title" id="chap-title"></h2>
      <div id="chap-body"></div>
    </section>

    <nav class="chap-nav" id="chap-nav">
      <button id="btn-prev" class="btn btn-sm">← 上一章</button>
      <button id="btn-toc2" class="btn btn-sm btn-ghost">目录</button>
      <button id="btn-next" class="btn btn-sm">下一章 →</button>
    </nav>

    <footer class="book-foot">
      <span>本页内容以密文形式存储于书籍仓库，由你的浏览器解密显示。</span>
    </footer>
  </article>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/core/util.js"></script>
<script src="assets/js/core/crypto.js"></script>
<script src="assets/js/core/markdown.js"></script>
<script src="assets/js/core/api.js"></script>
<script src="assets/js/read.js"></script>
</body>
</html>
